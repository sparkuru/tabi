services:
  db:
    image: ${TABI_POSTGRES_IMAGE:-postgres:17-alpine}
    command: ["postgres", "-c", "listen_addresses=${TABI_DB_HOST:-0.0.0.0}", "-p", "${TABI_DB_PORT:-5432}"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabi}
      POSTGRES_USER: ${POSTGRES_USER:-tabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TABI_DB_PORT: ${TABI_DB_PORT:-5432}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p \"$$TABI_DB_PORT\" -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${TABI_API_IMAGE:-${COMPOSE_PROJECT_NAME}-api:latest}
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tabi}
      POSTGRES_USER: ${POSTGRES_USER:-tabi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TABI_DB_PORT: ${TABI_DB_PORT:-5432}
      TABI_API_HOST: ${TABI_API_HOST:-0.0.0.0}
      TABI_API_PORT: ${TABI_API_PORT:-8000}
      TABI_MEDIA_ROOT: ${TABI_MEDIA_ROOT:-/data/media}
      TABI_COOKIE_SECURE: ${TABI_COOKIE_SECURE:-false}
    volumes:
      - media_data:${TABI_MEDIA_ROOT:-/data/media}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['TABI_API_PORT'] + '/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    image: ${TABI_WEB_IMAGE:-${COMPOSE_PROJECT_NAME}-web:latest}
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      TABI_PREVIEW_READY_TIMEOUT: ${TABI_PREVIEW_READY_TIMEOUT:-60}
      TABI_SITE_ADDRESS: ${TABI_SITE_ADDRESS:-:80}
      TABI_WEB_HOST: ${TABI_WEB_HOST:-0.0.0.0}
      TABI_WEB_HTTP_PORT: ${TABI_WEB_HTTP_PORT:-80}
      TABI_WEB_HTTPS_PORT: ${TABI_WEB_HTTPS_PORT:-443}
      TABI_API_PORT: ${TABI_API_PORT:-8000}
    ports:
      - "${TABI_HTTP_BIND:?Set TABI_HTTP_BIND in .env}:${TABI_WEB_HTTP_PORT:-80}"
      - "${TABI_HTTPS_BIND:?Set TABI_HTTPS_BIND in .env}:${TABI_WEB_HTTPS_PORT:-443}"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
