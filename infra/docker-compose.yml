services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tabi
      POSTGRES_USER: tabi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabi -d tabi"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    environment:
      TABI_DATABASE_URL: postgresql+psycopg://tabi:${POSTGRES_PASSWORD}@db:5432/tabi
      TABI_MEDIA_ROOT: /data/media
      TABI_COOKIE_SECURE: ${TABI_COOKIE_SECURE:-false}
    volumes:
      - media_data:/data/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
    environment:
      TABI_SITE_ADDRESS: ${TABI_SITE_ADDRESS:-:80}
    ports:
      - "${TABI_HTTP_BIND:?Set TABI_HTTP_BIND in infra/.env}:80"
      - "${TABI_HTTPS_BIND:?Set TABI_HTTPS_BIND in infra/.env}:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  media_data:
  caddy_data:
  caddy_config:
